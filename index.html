<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sidh Wick</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b0c;
    --bg-soft: #131314;
    --ink: #ededed;
    --ink-dim: #8a8a8e;
    --line: #232325;
    --accent: #b8944d;
    --accent-bright: #d9b874;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 32px;
    overflow-x: hidden;
  }

  .card {
    width: 100%;
    max-width: 380px;
    text-align: center;
  }

  .rule {
    width: 1px;
    height: 0;
    background: var(--accent);
    margin: 0 auto 28px;
    animation: growLine 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    animation-delay: 0.1s;
  }

  @keyframes growLine {
    to { height: 44px; }
  }

  .name {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 44px;
    letter-spacing: 0.02em;
    color: var(--ink);
    opacity: 0;
    transform: translateY(10px);
    animation: rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    animation-delay: 0.35s;
  }

  .tagline {
    margin-top: 8px;
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-dim);
    opacity: 0;
    transform: translateY(8px);
    animation: rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    animation-delay: 0.5s;
  }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }

  .links {
    margin-top: 48px;
    display: flex;
    flex-direction: column;
    border-top: 1px solid var(--line);
  }

  .link-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 4px;
    border-bottom: 1px solid var(--line);
    text-decoration: none;
    color: var(--ink);
    position: relative;
    opacity: 0;
    transform: translateY(8px);
    animation: rise 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    transition: color 0.25s ease, gap 0.25s ease, padding-left 0.25s ease;
  }

  .link-row:nth-of-type(1) { animation-delay: 0.62s; }
  .link-row:nth-of-type(2) { animation-delay: 0.72s; }
  .link-row:nth-of-type(3) { animation-delay: 0.82s; }
  .link-row:nth-of-type(4) { animation-delay: 0.92s; }

  .link-row .icon {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    color: var(--ink-dim);
    transition: color 0.25s ease;
  }

  .link-row .label {
    font-size: 15px;
    letter-spacing: 0.01em;
    flex: 1;
    text-align: left;
  }

  .link-row .arrow {
    font-size: 13px;
    color: var(--ink-dim);
    opacity: 0;
    transform: translateX(-4px);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }

  .link-row:hover {
    color: var(--accent-bright);
    padding-left: 8px;
  }

  .link-row:hover .icon {
    color: var(--accent-bright);
  }

  .link-row:hover .arrow {
    opacity: 1;
    transform: translateX(0);
    color: var(--accent-bright);
  }

  .footer {
    margin-top: 40px;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--line);
    opacity: 0;
    animation: rise 0.6s ease forwards;
    animation-delay: 1.05s;
  }

  @media (prefers-reduced-motion: reduce) {
    .rule, .name, .tagline, .link-row, .footer {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
      height: 44px !important;
    }
  }
</style>
</head>

<div class="card">
